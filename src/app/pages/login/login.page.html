<ion-content class="ion-padding">
  <main class="login">
    <ion-card>
      <ion-card-header>
        <ion-card-title>Iniciar sesión</ion-card-title>
      </ion-card-header>

      <ion-card-content>
        <form [formGroup]="form" (ngSubmit)="enviar()" novalidate>
          <ion-input
            label="Correo electrónico"
            labelPlacement="floating"
            fill="outline"
            type="email"
            autocomplete="email"
            formControlName="email"
            errorText="Introduce un correo electrónico válido"
          ></ion-input>

          <ion-input
            class="campo"
            label="Contraseña"
            labelPlacement="floating"
            fill="outline"
            type="password"
            autocomplete="current-password"
            formControlName="password"
            errorText="La contraseña debe tener al menos 6 caracteres"
          ></ion-input>

          @if (errorLogin()) {
            <p class="error" role="alert">{{ errorLogin() }}</p>
          }

          <ion-button
            class="boton"
            type="submit"
            expand="block"
            [disabled]="cargando()"
          >
            @if (cargando()) {
              <ion-spinner name="crescent" aria-label="Comprobando credenciales"></ion-spinner>
            } @else {
              Entrar
            }
          </ion-button>
        </form>
      </ion-card-content>
    </ion-card>
  </main>
</ion-content>
